; Perinode24 – 6-Kanal-Bleigel-Lader, ESP32-S3-WROOM-1-N8R8
; Öffnen: VS Code -> PlatformIO -> "Open Project" -> diesen Ordner (firmware/)
;
; Die Firmware braucht den Arduino-ESP32-Core 3.x (ledcAttach, sigmaDeltaAttach, ESP-IDF 5).
; Die offizielle PlatformIO-Plattform "espressif32" liefert nur Core 2.x, daher wird die
; Community-Plattform "pioarduino" verwendet. Für reproduzierbare Builds statt "stable" eine
; feste Version eintragen, z. B. .../releases/download/55.03.39/platform-espressif32.zip
; (Versionen: https://github.com/pioarduino/platform-espressif32/releases)

[platformio]
default_envs = perinode24

[env:perinode24]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Modul ESP32-S3-WROOM-1-N8R8: 8 MB Quad-Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; natives USB (USB-Serial/JTAG an IO19/IO20)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB, kein externer UART-Wandler nötig
    -Wall

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Erstes Flashen bei leerem Chip: BOOT gedrückt halten, RESET kurz drücken, dann Upload
